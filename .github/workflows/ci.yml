name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify formatting and show corrections
        run: |
          if ! npm run format:check; then
            npx prettier --write src server scripts tests index.html package.json tsconfig.json vite.config.ts vitest.config.ts eslint.config.js
            git diff
            exit 1
          fi
      - name: Verify with the production build environment
        run: npm run check
        env:
          NODE_ENV: production
      - run: npm audit --audit-level=moderate
